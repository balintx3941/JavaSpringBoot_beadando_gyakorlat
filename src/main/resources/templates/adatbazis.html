<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Adatbázis')}"></head>
<body>
<div class="container-xxl bg-white p-0">
    <div class="container-xxl position-relative p-0">
        <nav th:replace="~{fragments :: nav('adatbazis')}"></nav>
        <div th:replace="~{fragments :: pageheader('Adatbázis')}"></div>
    </div>

    <div class="container py-4">
        <p class="text-center mb-4">
            A cukrászda süteménykínálatának adatbázisa: a sütemények, azok összetevő-mentességei és az áraik.
        </p>

        <ul class="nav nav-pills justify-content-center mb-4" id="tabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-suti" type="button" role="tab">
                    Sütemények (<span th:text="${#lists.size(sutik)}">0</span>)</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-tartalom" type="button" role="tab">
                    Tartalom (<span th:text="${#lists.size(tartalmak)}">0</span>)</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-ar" type="button" role="tab">
                    Árak (<span th:text="${#lists.size(arak)}">0</span>)</button>
            </li>
        </ul>

        <div class="tab-content">
            <!-- suti tábla -->
            <div class="tab-pane fade show active" id="tab-suti" role="tabpanel">
                <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark" style="position: sticky; top: 0;">
                        <tr><th>ID</th><th>Név</th><th>Típus</th><th>Díjazott</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="s : ${sutik}">
                            <td th:text="${s.id}">1</td>
                            <td th:text="${s.nev}">Név</td>
                            <td th:text="${s.tipus}">Típus</td>
                            <td>
                                <span th:if="${s.dijazott}" class="badge bg-primary">Díjazott</span>
                                <span th:unless="${s.dijazott}" class="text-muted">–</span>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- tartalom tábla -->
            <div class="tab-pane fade" id="tab-tartalom" role="tabpanel">
                <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark" style="position: sticky; top: 0;">
                        <tr><th>ID</th><th>Sütemény azonosító</th><th>Sütemény</th><th>Mentes</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="t : ${tartalmak}">
                            <td th:text="${t.id}">1</td>
                            <td th:text="${t.sutiId}">1</td>
                            <td th:text="${sutiNevek[t.sutiId]}">Név</td>
                            <td><span class="badge bg-secondary" th:text="${t.mentes}">G</span></td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- ar tábla -->
            <div class="tab-pane fade" id="tab-ar" role="tabpanel">
                <div class="table-responsive" style="max-height: 600px; overflow-y: auto;">
                    <table class="table table-striped table-hover align-middle">
                        <thead class="table-dark" style="position: sticky; top: 0;">
                        <tr><th>ID</th><th>Sütemény azonosító</th><th>Sütemény</th><th class="text-end">Ár (Ft)</th><th>Egység</th></tr>
                        </thead>
                        <tbody>
                        <tr th:each="a : ${arak}">
                            <td th:text="${a.id}">1</td>
                            <td th:text="${a.sutiId}">1</td>
                            <td th:text="${sutiNevek[a.sutiId]}">Név</td>
                            <td class="text-end" th:text="${#numbers.formatInteger(a.ertek, 1, 'WHITESPACE')}">500</td>
                            <td th:text="${a.egyseg}">db</td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments :: footer}"></div>
</div>
<th:block th:replace="~{fragments :: scripts}"></th:block>
</body>
</html>
